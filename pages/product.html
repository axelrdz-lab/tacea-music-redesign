<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/product.css">

    <script src="../assets/js/components/TaceaNavbar.js"></script>
    <script src="../assets/js/components/TaceaFooter.js"></script>
    <script src="../assets/js/components/ProductCard.js"></script>
    <script src="../assets/js/components/ReviewCard.js"></script>

    <title>Tacea Music | Product</title>

  </head>

  <body>

    <tacea-navbar></tacea-navbar>

    <!-- product -->
    <section class="section product-details">
      <!-- images -->
      <div class="product-images row">
        <div class="column" id="product-aditional-imgs"></div>
        <div class="main-image">
          <img src="" alt="" id="product-img">
        </div>
      </div>
      <!-- information card -->
      <div class="product-overview column">
        <!-- category & name -->
        <div class="row header">
          <div class="column">
            <a href="" class="product-category" id="product-category"></a>
            <h2 id="product-name"></h2>
            <a href="" class="product-category" id="product-category"></a>
          </div>
          <div class="row other-actions">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.5 3C19.5376 3 22 5.5 22 9C22 16 14.5 20 12 21.5C9.5 20 2 16 2 9C2 5.5 4.5 3 7.5 3C9.35997 3 11 4 12 5C13 4 14.64 3 16.5 3ZM12.9339 18.6038C13.8155 18.0485 14.61 17.4955 15.3549 16.9029C18.3337 14.533 20 11.9435 20 9C20 6.64076 18.463 5 16.5 5C15.4241 5 14.2593 5.56911 13.4142 6.41421L12 7.82843L10.5858 6.41421C9.74068 5.56911 8.5759 5 7.5 5C5.55906 5 4 6.6565 4 9C4 11.9435 5.66627 14.533 8.64514 16.9029C9.39 17.4955 10.1845 18.0485 11.0661 18.6038C11.3646 18.7919 11.6611 18.9729 12 19.1752C12.3389 18.9729 12.6354 18.7919 12.9339 18.6038Z"></path>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 3V5H5V19H19V14H21V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V4C3 3.44772 3.44772 3 4 3H10ZM17.5858 5H13V3H21V11H19V6.41421L12 13.4142L10.5858 12L17.5858 5Z"></path>
            </svg>
          </div>
        </div>
        <!-- description -->
        <div class="column">
          <div class="row">
            <p class="bold">Descripción</p>
            <div class="horizontal-div"></div>
          </div>
          <p id="product-description"></p>
        </div>
        <!-- variants -->
        <div class="column">
          <div class="row">
            <p class="bold">Variantes</p>
            <div class="horizontal-div"></div>
          </div>
          <p id="product-description"></p>
        </div>
        <div class="row">
          <!-- price -->
          <div class="column product-price">
            <p class="bold" id="product-price-before-discount"></p>
            <h2 id="product-price"></h2>
          </div>
          <!-- quantity -->
          <div class="row product-quantity">
            <button>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M5 11V13H19V11H5Z"></path>
              </svg>
            </button>
            <span>1</span>
            <button>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"></path>
              </svg>
            </button>
          </div>
        </div>
        <!-- actions (buy, add to favorites, add to cart) -->
        <div class="column">
          <a class="btn-primary buy-btn" id="product-buy-btn" href="artistas.html">
              <span>COMPRAR</span>
          </a>
          <a class="btn-primary" href="artistas.html">
              <span>AGREGAR AL CARRITO</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.0049 22H4.00488C3.4526 22 3.00488 21.5523 3.00488 21V3C3.00488 2.44772 3.4526 2 4.00488 2H20.0049C20.5572 2 21.0049 2.44772 21.0049 3V21C21.0049 21.5523 20.5572 22 20.0049 22ZM19.0049 20V4H5.00488V20H19.0049ZM9.00488 6V8C9.00488 9.65685 10.348 11 12.0049 11C13.6617 11 15.0049 9.65685 15.0049 8V6H17.0049V8C17.0049 10.7614 14.7663 13 12.0049 13C9.24346 13 7.00488 10.7614 7.00488 8V6H9.00488Z"></path>
            </svg>
          </a>
        </div>
      </div>
    </section>

    <!-- recommended products -->
    <section class="section">
      <div class="row">
        <h2>Podría interesarte</h2>
        <div class="horizontal-div"></div>
      </div>
      <div class="carousel-row" id="suggested-products"></div>
    </section>

    <!-- product reviews -->
    <section class="section">
      <div class="row">
        <h2>Reseñas</h2>
        <div class="horizontal-div"></div>
      </div>
      <div class="info-card" id="product-reviews-is-empty">
      </div>
      <div id="product-reviews"></div>
    </section>

    <tacea-footer></tacea-footer>

    <script src="../assets/js/product.js"></script>
    
  </body>
</html>
